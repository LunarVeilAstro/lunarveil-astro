<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LunarVeilAstro · 小红书置顶卡片</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0a1a;color:#c0b8d0;font-family:"Noto Serif SC","STSong",serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
  h1{color:#d4b870;margin-bottom:4px;font-size:1.4em;letter-spacing:0.06em;font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;}
  .byline{color:#6a6a8a;font-size:0.78em;margin-bottom:16px;}
  .preview-wrap{position:relative;width:500px;height:500px;margin-bottom:16px;border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(180,140,90,0.15);}
  @media(max-width:520px){.preview-wrap{width:100%;height:auto;aspect-ratio:1/1;}}
  .card{position:absolute;inset:0;background:linear-gradient(155deg,#1a1038 0%,#2d1850 25%,#1f1635 45%,#2a1d40 65%,#302248 100%);overflow:hidden;user-select:none;}
  .card-glow{position:absolute;width:100%;height:100%;background:radial-gradient(ellipse at 50% 12%,rgba(220,170,110,0.14) 0%,rgba(160,120,200,0.06) 40%,transparent 60%),radial-gradient(ellipse at 50% 92%,rgba(200,160,120,0.08) 0%,transparent 30%);pointer-events:none;}
  .card-orbit{position:absolute;border:1px solid rgba(180,140,90,0.06);border-radius:50%;pointer-events:none;}
  .card-star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0.12}50%{opacity:0.85}}
  .card-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;padding:40px 36px;}
  .brand{font-family:"ZCOOL XiaoWei","Noto Serif SC",serif;color:#d4b870;font-size:28px;font-weight:bold;letter-spacing:0.12em;margin-bottom:4px;text-shadow:0 0 30px rgba(200,160,100,0.25);}
  .brand-sub{color:#9a90b8;font-size:13px;letter-spacing:0.6em;margin-bottom:18px;}
  .divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(200,160,100,0.5),transparent);margin-bottom:18px;}
  .tagline{color:#b8a8d0;font-size:14px;letter-spacing:0.1em;margin-bottom:4px;line-height:1.8;text-align:center;}
  .tagline em{color:#d4b870;font-style:normal;}
  .services{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 16px;}
  .service-tag{padding:6px 20px;font-size:12px;border:1px solid rgba(200,160,100,0.25);background:rgba(200,160,100,0.06);border-radius:999px;color:#c0b0d8;letter-spacing:0.06em;}
  .cta-box{background:rgba(200,160,100,0.08);border:1px solid rgba(200,160,100,0.3);border-radius:14px;padding:14px 28px;text-align:center;margin-bottom:10px;box-shadow:0 0 20px rgba(200,160,100,0.06);}
  .cta-main{color:#d4b870;font-size:16px;font-weight:bold;letter-spacing:0.08em;}
  .cta-sub{color:#8a8aaa;font-size:11px;letter-spacing:0.06em;margin-top:4px;}
  .bottom-text{color:#9a90b8;font-size:11px;letter-spacing:0.06em;margin-top:6px;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  button{padding:9px 20px;border:1px solid rgba(200,160,100,0.3);background:rgba(200,160,100,0.08);color:#c0a878;font-size:13px;border-radius:6px;cursor:pointer;font-family:inherit;transition:all 0.2s;}
  button:hover{background:rgba(200,160,100,0.18);}
  button.primary{background:rgba(200,160,100,0.18);border-color:rgba(200,160,100,0.5);font-weight:bold;}
  .note{margin-top:12px;color:#5a5a7a;font-size:0.7em;text-align:center;max-width:500px;line-height:1.5;}
  .note span{color:#7ab87a;}
</style>
</head>
<body>

<h1>LunarVeilAstro</h1>
<div class="byline">小红书置顶卡片生成器</div>

<div class="preview-wrap" id="previewArea"></div>

<div class="btn-row">
  <button class="primary" onclick="downloadCard()">下载 PNG (1080×1080)</button>
  <button onclick="refreshCard()">重新生成</button>
</div>

<div class="note">
  <span>✓ 小红书安全</span> — 不含"微信""加好友""私信""咨询""AI"等敏感词<br>
  引导逻辑：用户看到卡片 → 搜索 <b>LunarVeilAstro</b> → 全平台同名找到你
</div>

<script>
function _roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

// Brand taglines — all censorship-safe, no contact info
var TAGLINES = [
  '读懂星星的暗语<br>也读懂<span>自己</span>',
  '星空从不说话<br>但<span>答案</span>一直在那里',
  '你的星盘<br>是一张只属于你的<span>地图</span>',
  '每一颗星<br>都在讲一个关于<span>你</span>的故事',
  '宇宙写好了剧本<br><span>你</span>是唯一的主角',
  '仰望星空的人<br>终将找到自己的<span>轨道</span>',
  '星月流转<br><span>你</span>的每一刻都值得被解读',
  '不是迷信<br>是<span>自我觉察</span>的另一面镜子'
];

var SERVICES = ['本命星盘','每日运势','梅花易数','合盘解读'];

function randPick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function renderPreview(){
  var tagline = randPick(TAGLINES);
  var container = document.getElementById('previewArea');
  var starsHtml = '';
  for (var i=0;i<30;i++){
    var sx=Math.random()*100,sy=Math.random()*100;
    var sr=Math.random()*2+0.4,sd=Math.random()*3.5;
    starsHtml+='<div class="card-star" style="left:'+sx+'%;top:'+sy+'%;width:'+sr+'px;height:'+sr+'px;animation-delay:'+sd+'s;"></div>';
  }

  var serviceTags = SERVICES.map(function(s){return '<span class="service-tag">'+s+'</span>';}).join('');

  container.innerHTML =
    '<div class="card" id="cardTarget">'+
    '<div class="card-glow"></div>'+
    '<div class="card-stars">'+starsHtml+'</div>'+
    '<div class="card-orbit" style="width:60%;height:60%;top:20%;left:20%;"></div>'+
    '<div class="card-orbit" style="width:78%;height:78%;top:11%;left:11%;"></div>'+
    '<div class="card-orbit" style="width:92%;height:92%;top:4%;left:4%;"></div>'+
    '<div class="card-inner">'+
    '<div class="brand">LunarVeilAstro</div>'+
    '<div class="brand-sub">全 平 台 同 名</div>'+
    '<div class="divider"></div>'+
    '<div class="tagline">'+tagline+'</div>'+
    '<div class="services">'+serviceTags+'</div>'+
    '<div class="cta-box">'+
    '<div class="cta-main">✦ 全平台同名搜索 ✦</div>'+
    '<div class="cta-sub">每日运势之外 · 还有深度解读</div>'+
    '</div>'+
    '<div class="bottom-text">每天更新 · 每日运势 · 星盘解读 · 梅花易数</div>'+
    '</div></div>';
}

function refreshCard(){renderPreview();}

function downloadCard(){
  var W=1080,H=1080;
  var canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');

  // Background — lighter at bottom
  var bgGrad=ctx.createLinearGradient(W*0.2,0,W*0.8,H);
  bgGrad.addColorStop(0,'#1a1038');bgGrad.addColorStop(0.25,'#2d1850');
  bgGrad.addColorStop(0.5,'#1f1635');bgGrad.addColorStop(0.7,'#2a1d40');
  bgGrad.addColorStop(1,'#302248');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  // Glow — top gold + bottom warm
  var glowGrad=ctx.createRadialGradient(W*0.5,H*0.08,0,W*0.5,H*0.25,H*0.52);
  glowGrad.addColorStop(0,'rgba(220,170,110,0.12)');
  glowGrad.addColorStop(0.4,'rgba(160,120,200,0.06)');
  glowGrad.addColorStop(1,'transparent');
  ctx.fillStyle=glowGrad;ctx.fillRect(0,0,W,H);
  var glowGrad2=ctx.createRadialGradient(W*0.5,H*0.92,0,W*0.5,H*0.85,H*0.2);
  glowGrad2.addColorStop(0,'rgba(200,160,120,0.07)');glowGrad2.addColorStop(1,'transparent');
  ctx.fillStyle=glowGrad2;ctx.fillRect(0,0,W,H);

  // Orbits
  ctx.strokeStyle='rgba(180,140,90,0.06)';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(W*0.5,H*0.5,H*0.3,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W*0.5,H*0.5,H*0.39,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W*0.5,H*0.5,H*0.46,0,Math.PI*2);ctx.stroke();

  // Stars
  for(var i=0;i<70;i++){
    var sx=Math.random()*W,sy=Math.random()*H;
    var sr=Math.random()*2.5+0.3;
    var alpha=0.1+Math.random()*0.7;
    ctx.fillStyle='rgba(255,255,255,'+alpha+')';
    ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
  }

  var cx=W*0.5;
  var tagline=randPick(TAGLINES);

  // Brand
  ctx.fillStyle='#d4b870';
  ctx.font='bold '+Math.round(W*0.06)+'px "ZCOOL XiaoWei","Noto Serif SC","STSong",serif';
  ctx.textAlign='center';
  ctx.shadowColor='rgba(200,160,100,0.25)';ctx.shadowBlur=W*0.03;
  ctx.fillText('LunarVeilAstro',cx,H*0.36);
  ctx.shadowBlur=0;

  // Brand sub
  ctx.fillStyle='#9a90b8';
  ctx.font=Math.round(W*0.028)+'px "Noto Serif SC","STSong",serif';
  ctx.fillText('全 平 台 同 名',cx,H*0.43);

  // Divider
  var dGrad=ctx.createLinearGradient(cx-W*0.12,0,cx+W*0.12,0);
  dGrad.addColorStop(0,'transparent');dGrad.addColorStop(0.5,'rgba(200,160,100,0.5)');dGrad.addColorStop(1,'transparent');
  ctx.strokeStyle=dGrad;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx-W*0.12,H*0.47);ctx.lineTo(cx+W*0.12,H*0.47);ctx.stroke();

  // Tagline — two lines
  ctx.fillStyle='#b8a8d0';
  ctx.font=Math.round(W*0.032)+'px "Noto Serif SC","STSong",serif';
  var lines=tagline.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').split('\n');
  for(var l=0;l<lines.length;l++){
    // Highlight spans — use gold for emphasized text
    var lineText=lines[l];
    // Just render plain, stripped text
    var stripped=lineText.replace(/<[^>]*>/g,'').replace(/<\/[^>]*>/g,'');
    // Actually render with gold highlights
    var match=tagline.match(/<span>([^<]+)<\/span>/);
    var hlText=match?match[1]:'';
    if(hlText&&lines[l].indexOf(hlText)>=0){
      var parts=lines[l].split(hlText);
      var fullWidth=ctx.measureText(parts[0]+hlText+parts[1]).width;
      var beforeWidth=ctx.measureText(parts[0]).width;
      var hlWidth=ctx.measureText(hlText).width;
      var startX=cx-fullWidth/2;

      ctx.fillText(parts[0],startX,H*0.52+l*Math.round(W*0.06));
      var beforeW=ctx.measureText(parts[0]).width;
      ctx.fillStyle='#d4b870';
      ctx.fillText(hlText,startX+beforeW,H*0.52+l*Math.round(W*0.06));
      ctx.fillStyle='#b8a8d0';
      ctx.fillText(parts[1],startX+beforeW+hlWidth,H*0.52+l*Math.round(W*0.06));
    } else {
      ctx.fillText(lines[l],cx,H*0.52+l*Math.round(W*0.06));
    }
  }

  // Service tags
  var svcY=H*0.62;
  var svcTotal=SERVICES.length*(W*0.2)+(SERVICES.length-1)*(W*0.02);
  var svcStart=cx-svcTotal/2;
  for(var t=0;t<SERVICES.length;t++){
    var tx=svcStart+t*(W*0.2+W*0.02);
    var tw=W*0.2,th=Math.round(W*0.06);
    ctx.fillStyle='rgba(200,160,100,0.06)';
    ctx.strokeStyle='rgba(200,160,100,0.25)';ctx.lineWidth=1;
    _roundRect(ctx,tx,svcY,tw,th,W*0.03);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#c0b0d8';
    ctx.font=Math.round(W*0.026)+'px "Noto Serif SC","STSong",serif';
    ctx.fillText(SERVICES[t],tx+tw/2,svcY+th*0.68);
  }

  // CTA box
  var ctaW=W*0.55,ctaH=Math.round(W*0.1);
  var ctaX=cx-ctaW/2,ctaY=H*0.73;
  ctx.fillStyle='rgba(200,160,100,0.08)';
  ctx.strokeStyle='rgba(200,160,100,0.3)';ctx.lineWidth=1.5;
  _roundRect(ctx,ctaX,ctaY,ctaW,ctaH,W*0.035);
  ctx.fill();ctx.stroke();

  ctx.fillStyle='#d4b870';
  ctx.font='bold '+Math.round(W*0.034)+'px "Noto Serif SC","STSong",serif';
  ctx.fillText('✦ 全平台同名搜索 ✦',cx,ctaY+ctaH*0.42);
  ctx.fillStyle='#8a8aaa';
  ctx.font=Math.round(W*0.022)+'px "Noto Serif SC","STSong",serif';
  ctx.fillText('每日运势之外 · 还有深度解读',cx,ctaY+ctaH*0.74);

  // Bottom text
  ctx.fillStyle='#9a90b8';
  ctx.font=Math.round(W*0.022)+'px "Noto Serif SC","STSong",serif';
  ctx.fillText('每天更新 · 每日运势 · 星盘解读 · 梅花易数',cx,H*0.91);

  // Watermark
  ctx.fillStyle='rgba(180,140,90,0.1)';
  ctx.font=Math.round(W*0.018)+'px "Noto Serif SC","STSong",serif';
  ctx.fillText('✦ LunarVeilAstro · 全平台同名 ✦',cx,H*0.96);

  var link=document.createElement('a');
  link.download='LunarVeilAstro_小红书置顶.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}

renderPreview();
</script>
</body>
</html>
