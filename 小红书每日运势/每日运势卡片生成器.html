function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function shufflePick(arr, n){
  var copy = arr.slice();
  for (var i = copy.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp; }
  return copy.slice(0, Math.min(n, copy.length));
}

function getMoonData(deg){
  var idx = Math.floor(deg / 30);
  var data = MOON_DATA[idx];
  return {
    signName: moonSignName(deg),
    signEmoji: moonSignEmoji(deg),
    signDeg: (deg % 30).toFixed(1) + '°',
    msg: randPick(data.msgs),
    yi: shufflePick(data.yi, 3),
    ji: shufflePick(data.ji, 3),
    colors: data.colors[0],
    crystal: data.crystal,
    tags: data.tags
  };
}

function generateContent(y, m, d){
  var jd = jdFromDate(y, m, d);
  var moonDeg = moonLongitude(jd);
  var moonData = getMoonData(moonDeg);
  var tasteItem = randPick(TASTE_POOL);
  var wearItem = Math.random() < 0.45 ? randPick(CASUAL_WEAR) : moonData.crystal;
  var cta = randPick(CTA_POOL);

  // Tags
  var tags = BASE_TAGS.slice();
  tags.push("#月亮" + moonData.signName);
  tags = tags.concat(moonData.tags.slice(0, 2));

  // Title
  var tpl = randPick(TITLE_TEMPLATES);
  var wd = weekDayCN(y, m, d);
  var dateStr = y + "." + String(m).padStart(2,"0") + "." + String(d).padStart(2,"0");
  var yiKw = moonData.yi[0];
  var jiKw = moonData.ji[0];
  var title = tpl
    .replace("{emoji}", moonData.signEmoji)
    .replace(/\{sign\}/g, moonData.signName)
    .replace("{yi_keyword}", yiKw)
    .replace("{ji_keyword}", jiKw)
    .replace("{date}", dateStr)
    .replace("{weekday}", wd);

  return {
    year: y, month: m, day: d,
    moonSign: moonData.signName, moonEmoji: moonData.signEmoji, moonDeg: moonData.signDeg,
    moonMsg: moonData.msg, yi: moonData.yi, ji: moonData.ji,
    colors: moonData.colors, wearItem: wearItem, tasteItem: tasteItem,
    tasteEmoji: tasteEmoji(tasteItem), cta: cta, tags: tags, title: title
  };
}

function copyText(elId,label){
  var el = document.getElementById(elId);
  var text = el.textContent.trim();
  navigator.clipboard.writeText(text).then(function(){
    var btns = document.querySelectorAll('.copy-btn');
    for (var i=0;i<btns.length;i++){ btns[i].textContent = '📋 复制'; btns[i].classList.remove('copied'); }
    var row = el.closest('.copy-row');
    var btn = row.querySelector('.copy-btn');
    btn.textContent = '✓ 已复制'; btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = '📋 复制'; btn.classList.remove('copied'); }, 2000);
  }).catch(function(){ alert('复制失败，请手动选中：'+text); });
}

function _roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r); ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function downloadCard(){
  if (!currentContent){ generateCard(); }
  var c = currentContent;
  var W = 1080, H = 1440;
  var canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  // Background — purple-gold gradient
  var bgGrad = ctx.createLinearGradient(W*0.2, 0, W*0.8, H);
  bgGrad.addColorStop(0, '#1a1038'); bgGrad.addColorStop(0.25, '#2d1850');
  bgGrad.addColorStop(0.45, '#1a1435'); bgGrad.addColorStop(0.65, '#241a30');
  bgGrad.addColorStop(0.85, '#2a1a28'); bgGrad.addColorStop(1, '#1a1228');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  // Glow — warm gold center, purple edge
  var glowGrad = ctx.createRadialGradient(W*0.5, H*0.08, 0, W*0.5, H*0.25, H*0.5);
  glowGrad.addColorStop(0, 'rgba(220,170,110,0.12)');
  glowGrad.addColorStop(0.4, 'rgba(180,140,200,0.07)');
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad; ctx.fillRect(0, 0, W, H);

  // Orbits
  ctx.strokeStyle = 'rgba(180,140,90,0.05)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(W*0.5, H*0.5, H*0.32, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W*0.5, H*0.5, H*0.4, 0, Math.PI*2); ctx.stroke();

  // Stars
  for (var i=0; i<60; i++){
    var sx=Math.random()*W, sy=Math.random()*H;
    var sr=Math.random()*2.5+0.3;
    var alpha=0.12+Math.random()*0.7;
    ctx.fillStyle='rgba(255,255,255,'+alpha+')';
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
  }

  var pad = Math.round(W*0.08);
  var w = W - pad*2;
  var cy = Math.round(H*0.04);

  // Brand
  ctx.fillStyle = '#d4b870';
  ctx.font = 'bold '+Math.round(W*0.05)+'px "ZCOOL XiaoWei","Noto Serif SC","STSong",serif';
  ctx.textAlign = 'left';
  ctx.fillText('LunarVeilAstro', pad, cy+Math.round(W*0.05));
  ctx.fillStyle = '#6a6a8a';
  ctx.font = Math.round(W*0.028)+'px "Noto Serif SC","Georgia","STSong",serif';
  ctx.fillText('每日运势 · 小红书专属', pad, cy+Math.round(W*0.09));

  // Date
  ctx.textAlign = 'right';
  var dateStr = c.year+'.'+String(c.month).padStart(2,'0')+'.'+String(c.day).padStart(2,'0');
  ctx.fillStyle = '#8a8aaa';
  ctx.font = Math.round(W*0.04)+'px "Noto Serif SC","Georgia","STSong",serif';
  ctx.fillText(dateStr, W-pad, cy+Math.round(W*0.055));
  ctx.font = Math.round(W*0.028)+'px "Noto Serif SC","Georgia","STSong",serif';
  ctx.fillText('星期'+weekDayCN(c.year,c.month,c.day), W-pad, cy+Math.round(W*0.1));

  // Moon section
  var moonY = cy + Math.round(H*0.13);
  ctx.textAlign = 'left';
  ctx.font = Math.round(W*0.12)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  ctx.fillText(c.moonEmoji, pad, moonY+Math.round(W*0.1));

  ctx.fillStyle = '#d4b870';
  ctx.font = 'bold '+Math.round(W*0.052)+'px "Noto Serif SC","Georgia","STSong",serif';
  ctx.fillText('今日月亮：'+c.moonSign+' '+c.moonDeg, pad+Math.round(W*0.16), moonY+Math.round(W*0.06));

  // Moon message — word wrap
  ctx.fillStyle = '#c0b8d8';
  ctx.font = 'italic '+Math.round(W*0.04)+'px "Noto Serif SC","Georgia","STSong",serif';
  var msg = '"'+c.moonMsg+'"';
  var maxMW = w - Math.round(W*0.16);
  var msgLines = wrapText(ctx, msg, maxMW);
  for (var ml=0; ml<msgLines.length; ml++){
    ctx.fillText(msgLines[ml], pad+Math.round(W*0.16), moonY+Math.round(W*0.11)+ml*Math.round(W*0.052));
  }

  // Divider
  var divY = moonY + Math.round(H*0.125);
  var dGrad = ctx.createLinearGradient(pad, 0, W-pad, 0);
  dGrad.addColorStop(0, 'transparent'); dGrad.addColorStop(0.5, 'rgba(200,160,100,0.35)'); dGrad.addColorStop(1, 'transparent');
  ctx.strokeStyle = dGrad; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, divY); ctx.lineTo(W-pad, divY); ctx.stroke();

  // 宜
  var yiY = divY + Math.round(H*0.045);
  ctx.fillStyle = '#7ab87a';
  ctx.font = 'bold '+Math.round(W*0.036)+'px "Noto Serif SC","STSong","Georgia",serif';
  ctx.fillText('✦ 宜', pad, yiY);
  ctx.fillStyle = '#c0b8d0';
  ctx.font = Math.round(W*0.034)+'px "Noto Serif SC","STSong","Georgia",serif';
  for (var yi=0; yi<c.yi.length; yi++){
    ctx.fillText('○  '+c.yi[yi], pad+Math.round(W*0.04), yiY+Math.round(H*0.042)*(yi+1));
  }

  // 忌
  var jiY = yiY + Math.round(H*0.042)*(c.yi.length+1) + Math.round(H*0.03);
  ctx.fillStyle = '#b87a7a';
  ctx.font = 'bold '+Math.round(W*0.036)+'px "Noto Serif SC","STSong","Georgia",serif';
  ctx.fillText('✧ 忌', pad, jiY);
  ctx.fillStyle = '#c0b8d0';
  ctx.font = Math.round(W*0.034)+'px "Noto Serif SC","STSong","Georgia",serif';
  for (var ji=0; ji<c.ji.length; ji++){
    ctx.fillText('○  '+c.ji[ji], pad+Math.round(W*0.04), jiY+Math.round(H*0.042)*(ji+1));
  }

  // Divider 2
  var div2Y = jiY + Math.round(H*0.042)*(c.ji.length+1) + Math.round(H*0.04);
  var d2Grad = ctx.createLinearGradient(pad, 0, W-pad, 0);
  d2Grad.addColorStop(0, 'transparent'); d2Grad.addColorStop(0.5, 'rgba(200,160,100,0.35)'); d2Grad.addColorStop(1, 'transparent');
  ctx.strokeStyle = d2Grad; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, div2Y); ctx.lineTo(W-pad, div2Y); ctx.stroke();

  // Gems — vertical stack, each item gets its own row (drink names can be long)
  var gemY = div2Y + Math.round(H*0.05);
  var gemH = Math.round(H*0.055);
  var gemGap = Math.round(H*0.015);
  var gemItems = [
    {icon:'🎨', label:'宜穿戴：'+c.colors},
    {icon:'💎', label:'宜佩戴：'+c.wearItem},
    {icon: c.tasteEmoji, label:'宜品鉴：'+c.tasteItem}
  ];
  var gemFontSz = Math.round(W*0.038);
  var gemIconSz = Math.round(W*0.06);
  ctx.textAlign = 'left';
  for (var g=0; g<gemItems.length; g++){
    var gy = gemY + g*(gemH + gemGap);
    // Subtle row background
    ctx.fillStyle = 'rgba(180,140,90,' + (0.04 + g*0.025) + ')';
    _roundRect(ctx, pad, gy, w, gemH, Math.round(W*0.025));
    ctx.fill();
    // Icon
    ctx.font = gemIconSz+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    ctx.fillText(gemItems[g].icon, pad + Math.round(W*0.04), gy + gemH*0.7);
    // Label
    ctx.fillStyle = '#c0b8d0';
    ctx.font = gemFontSz+'px "Noto Serif SC","STSong","Georgia",serif';
    ctx.fillText(gemItems[g].label, pad + Math.round(W*0.14), gy + gemH*0.68);
  }

  // CTA box
  var ctaY = gemY + gemItems.length*(gemH + gemGap) + Math.round(H*0.045);
  var ctaH = Math.round(H*0.085);
  ctx.fillStyle = 'rgba(180,140,90,0.08)';
  ctx.strokeStyle = 'rgba(200,160,100,0.25)';
  ctx.lineWidth = 2;
  _roundRect(ctx, pad, ctaY, w, ctaH, Math.round(W*0.03));
  ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#c0b8d0';
  ctx.font = Math.round(W*0.034)+'px "Noto Serif SC","STSong","Georgia",serif';
  ctx.textAlign = 'center';
  ctx.fillText(c.cta, W*0.5, ctaY+ctaH*0.6);
  ctx.textAlign = 'left';

  // Bottom watermark
  ctx.fillStyle = 'rgba(180,140,90,0.1)';
  ctx.font = Math.round(W*0.022)+'px "Noto Serif SC","Georgia","STSong",serif';
  ctx.textAlign = 'center';
  ctx.fillText('✦ LunarVeilAstro · 全平台同名 ✦', W*0.5, H*0.975);

  // Download
  var link = document.createElement('a');
  link.download = 'LunarVeilAstro_每日运势_'+c.year+String(c.month).padStart(2,'0')+String(c.day).padStart(2,'0')+'.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function wrapText(ctx, text, maxWidth){
  var words = text.split('');
  var lines = [];
  var current = '';
  for (var i=0; i<words.length; i++){
    var test = current + words[i];
    if (ctx.measureText(test).width > maxWidth && current.length>0){
      lines.push(current); current = words[i];
    } else { current = test; }
  }
  if (current) lines.push(current);
  return lines;
}

// ═══════════════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════════════
generateCard();
