<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LunarVeilAstro · 维护中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, #0d0d24 0%, #050510 70%);
  font-family: 'Cormorant Garamond', 'Ma Shan Zheng', serif;
  color: #c8c8d0;
}
.main {
  text-align: center; padding: 40px 20px; max-width: 500px;
}
.stars {
  font-size: 2em; letter-spacing: 0.3em; margin-bottom: 30px;
  animation: twinkle 2s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
h1 {
  font-family: 'Cinzel', serif; font-weight: 400; font-size: 2em;
  background: linear-gradient(180deg, #fdf0c8 0%, #e2bc6e 30%, #b8861e 60%, #d4a840 80%, #f5e6b8 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 16px; letter-spacing: 0.12em;
}
.sub {
  font-size: 1.1em; color: #b0a8c0; letter-spacing: 0.1em; margin-bottom: 40px;
}
.ring {
  width: 80px; height: 80px; margin: 0 auto 30px;
  border: 2px solid rgba(200,169,110,0.3); border-radius: 50%;
  border-top-color: #c9a96e; animation: spin 3s linear infinite;
  position: relative;
}
.ring::after {
  content: '✦'; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%); font-size: 1.5em; color: #c9a96e;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hint {
  font-size: 0.8em; color: #7a7a8a; letter-spacing: 0.06em; line-height: 1.8;
}
.hint a { color: #c9a96e; text-decoration: none; }
</style>
</head>
<body>
<div class="main">
  <div class="stars">✦ ✦ ✦</div>
  <div class="ring"></div>
  <h1>LunarVeilAstro</h1>
  <div class="sub">星辰正在重新排列…</div>
  <p class="hint">
    网站正在升级维护，请稍后再来。<br>
    如需星盘解读，请添加微信<br>
    <strong>LunarVeilAstro</strong>
  </p>
</div>
</body>
</html>
